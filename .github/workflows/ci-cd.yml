name: Chatbot CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  LOCAL_IMAGE: chatbot-api:ci

jobs:
  build-test-push:
    name: Build, test and publish
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatdb

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d chatdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chatdb
          GEMINI_API_KEY: test-key
          GEMINI_MODEL: gemini-3.6-flash
          APP_ENV: test
        run: python -m pytest -q
        
      - name: Build Docker image
        run: |
          docker build \
            --tag "${LOCAL_IMAGE}" \
            .

      - name: Start chatbot container
        run: |
          docker run --detach \
            --name chatbot-api \
            --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/chatdb \
            --env APP_ENV=test \
            --env GEMINI_API_KEY=test-key \
            --env GEMINI_MODEL=gemini-3.6-flash \
            "${LOCAL_IMAGE}"

      - name: Test health endpoint
        run: |
          echo "Waiting for chatbot API..."

          for attempt in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/health \
              --output health-response.json
            then
              echo "Health endpoint responded:"
              cat health-response.json

              python - <<'PY'
          import json

          with open("health-response.json", encoding="utf-8") as file:
              response = json.load(file)

          assert response["status"] == "ok", response
          print("Health test passed")
          PY
              exit 0
            fi

            echo "Attempt ${attempt}/30 failed; retrying..."
            sleep 2
          done

          echo "failed health check"
          docker logs chatbot-api
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm --force chatbot-api || true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "${LOCAL_IMAGE}" \
            "${{ vars.DOCKERHUB_USERNAME }}/chatbot-api:latest"

          docker tag "${LOCAL_IMAGE}" \
            "${{ vars.DOCKERHUB_USERNAME }}/chatbot-api:${GITHUB_SHA}"

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            "${{ vars.DOCKERHUB_USERNAME }}/chatbot-api:latest"

          docker push \
            "${{ vars.DOCKERHUB_USERNAME }}/chatbot-api:${GITHUB_SHA}"

  deploy:
    name: Deploy to EC2
    needs: build-test-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: production

    concurrency:
      group: chatbot-production
      cancel-in-progress: false

    env:
      DEPLOY_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/chatbot-api:${{ github.sha }}

    steps:
      - name: Deploy image and check health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_IMAGE
          command_timeout: 10m

          script: |
            set -eu
            cd "$HOME/chatbot_new"

            test -f compose.yaml
            test -f app.env

            PREVIOUS_IMAGE=""
            if [ -f deployed-image.txt ]; then
              PREVIOUS_IMAGE="$(cat deployed-image.txt)"
            fi

            export CHATBOT_IMAGE="$DEPLOY_IMAGE"

            # Download first: a failed pull leaves the old app running.
            docker compose pull chatbot

            check_health() {
              attempt=1

              while [ "$attempt" -le 30 ]; do
                if curl --fail --silent --show-error \
                  --connect-timeout 2 \
                  --max-time 5 \
                  http://127.0.0.1:8000/health \
                  -o /tmp/chatbot-health.json
                then
                  if docker compose exec -T chatbot python -c \
                    'import json,sys; data=json.load(sys.stdin); sys.exit(0 if data.get("status") == "ok" else 1)' \
                    < /tmp/chatbot-health.json
                  then
                    return 0
                  fi
                fi

                sleep 2
                attempt=$((attempt + 1))
              done

              return 1
            }

            if docker compose up -d --no-deps chatbot && check_health; then
              printf '%s\n' "$DEPLOY_IMAGE" > deployed-image.txt
              echo "Deployment succeeded"
            else
              echo "Deployment failed"
              docker compose logs --tail=100 chatbot || true

              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Restoring previous image"
                export CHATBOT_IMAGE="$PREVIOUS_IMAGE"
                docker compose up -d --no-deps chatbot

                if check_health; then
                  echo "Rollback succeeded"
                else
                  echo "Rollback health check failed"
                fi
              fi

              exit 1
            fi